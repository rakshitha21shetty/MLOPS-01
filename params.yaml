kaggle:
  dataset: brijbhushannanda1979/bigmart-sales-data

data:
  raw_dir: data/raw
  raw_train_path: data/raw/Train.csv
  processed_path: data/processed/train_processed.csv
  target: Item_Outlet_Sales
  test_size: 0.2
  random_state: 42

mlflow:
  tracking_uri: mlflow_store
  experiment_name: bigmart-sales-forecasting
  registered_model_name: bigmart-sales-model

model:
  cv_folds: 5
  random_state: 42
  random_forest:
    n_estimators: 300
    max_depth: 8
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05

monitoring:
  reference_sample_size: 0.5
  reports_dir: reports
