stages:
  download:
    cmd: python -m src.data.download_data
    outs:
      - data/raw/Train.csv
      - data/raw/Test.csv

  validate:
    cmd: python -m src.data.validate_data
    deps:
      - data/raw/Train.csv
      - src/data/validate_data.py

  build_features:
    cmd: python -m src.features.build_features
    deps:
      - data/raw/Train.csv
      - src/features/build_features.py
      - params.yaml
    outs:
      - data/processed/train_processed.csv

  train:
    cmd: python -m src.models.train
    deps:
      - data/processed/train_processed.csv
      - src/models/train.py
      - params.yaml
    outs:
      - mlruns:
          cache: false
      - mlflow_store:
          cache: false

  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - mlruns
      - mlflow_store
      - src/models/evaluate.py
